<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Stage Rehearsal Attendance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="bg-orb bg-orb-a"></div>
    <div class="bg-orb bg-orb-b"></div>

    <header class="site-header">
      <div>
        <h1>Stage Rehearsal Attendance</h1>
        <p>Dual-view system for production teams and students</p>
      </div>
      <nav>
        <a href="/" id="admin-link">Admin View</a>
        <a href="/student" id="student-link">Student View</a>
      </nav>
    </header>

    <main id="app"></main>

    <template id="admin-login-template">
      <section class="panel narrow admin-login-card">
        <h2>Admin Sign In</h2>
        <p class="muted">Managers, officers, and directors only.</p>
        <form id="admin-login-form" class="stack-form">
          <label>
            Username
            <input name="username" required>
          </label>
          <label>
            Password
            <input name="password" type="password" required>
          </label>
          <button type="submit" class="login-submit">Sign In</button>
        </form>
      </section>
    </template>

    <script src="app.js"></script>
  </body>
</html>
